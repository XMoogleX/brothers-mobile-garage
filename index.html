<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brothers Mobile Garage — Prototype</title><style>body{font:16px system-ui;background:#f5f6f8;color:#17212d;margin:0}header{background:#17212d;color:white;padding:20px}main{max-width:980px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;background:#17212d;color:white;border:0;border-radius:6px;padding:10px 14px}.tabs button{background:#e0e5eb;color:#17212d}.tabs button.active{background:#17212d;color:white}section{background:white;border-radius:10px;padding:20px;margin-top:15px;box-shadow:0 1px 4px #0001}label{display:block;margin:10px 0}input,select,textarea{box-sizing:border-box;width:100%;padding:9px;border:1px solid #bbc3cc;border-radius:5px}form{max-width:650px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.muted{color:#576474}.entry{border-bottom:1px solid #ddd;padding:10px 0}small{color:#576474}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}@media print{header,.tabs,form,.no-print{display:none!important}body{background:white}section{box-shadow:none}}</style></head><body><header><h1>Brothers Mobile Garage</h1><div>Shop Management — Local Prototype</div></header><main><p class="muted">Demo only: data is stored in this browser, not synced or backed up. Do not enter real customer information.</p><nav class="tabs" id="tabs"></nav><div id="view"></div></main><script>
const K='bmg-demo-v1';let db=JSON.parse(localStorage.getItem(K)||'{"customers":[],"vehicles":[],"estimates":[]}');let tab='Customers';const save=()=>localStorage.setItem(K,JSON.stringify(db));const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>crypto.randomUUID();const money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'});function options(arr,label){return arr.map(x=>`<option value="${esc(x.id)}">${esc(label(x))}</option>`).join('')};function render(){ $('tabs').innerHTML=['Customers','Vehicles','Estimates','Invoices'].map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('view').innerHTML=({Customers:customers,Vehicles:vehicles,Estimates:estimates,Invoices:invoices})[tab]();bind()}
function customers(){return `<section><h2>Add customer</h2><form id="customer"><div class="grid"><label>Name<input name="name" required></label><label>Phone<input name="phone"></label></div><label>Email<input name="email" type="email"></label><label>Service address<input name="address"></label><button>Add customer</button></form></section><section><h2>Customers (${db.customers.length})</h2>${db.customers.map(c=>`<div class="entry"><b>${esc(c.name)}</b><div>${esc(c.phone)} · ${esc(c.email)}</div><small>${esc(c.address)}</small></div>`).join('')||'No customers yet.'}</section>`}
function vehicles(){return `<section><h2>Add vehicle</h2><form id="vehicle"><label>Customer<select name="customerId" required><option value="">Select customer</option>${options(db.customers,c=>c.name)}</select></label><div class="grid"><label>Year<input name="year" type="number" min="1900" max="2100" required></label><label>Make<input name="make" required></label><label>Model<input name="model" required></label><label>Mileage<input name="mileage" type="number" min="0"></label></div><label>VIN<input name="vin" maxlength="17"></label><label>License plate<input name="plate"></label><button>Add vehicle</button></form></section><section><h2>Vehicles (${db.vehicles.length})</h2>${db.vehicles.map(v=>`<div class="entry"><b>${esc(v.year)} ${esc(v.make)} ${esc(v.model)}</b><div>${esc(db.customers.find(c=>c.id===v.customerId)?.name)}</div><small>VIN: ${esc(v.vin)} · Plate: ${esc(v.plate)} · Mileage: ${esc(v.mileage)}</small></div>`).join('')||'No vehicles yet.'}</section>`}
function estimates(){return `<section><h2>Create estimate</h2><form id="estimate"><label>Vehicle<select name="vehicleId" required><option value="">Select vehicle</option>${options(db.vehicles,v=>`${v.year} ${v.make} ${v.model} — ${db.customers.find(c=>c.id===v.customerId)?.name||''}`)}</select></label><label>Work description<textarea name="description" required></textarea></label><div class="grid"><label>Parts cost ($)<input name="partsCost" type="number" min="0" step=".01" value="0" required></label><label>Parts markup (%)<input name="markup" type="number" min="0" step=".01" value="0" required></label><label>Labor hours<input name="hours" type="number" min="0" step=".01" value="0" required></label><label>Hourly labor rate ($)<input name="rate" type="number" min="0" step=".01" value="100" required></label><label>Travel / other fees ($)<input name="fees" type="number" min="0" step=".01" value="0" required></label><label>Estimated tax ($)<input name="tax" type="number" min="0" step=".01" value="0" required></label></div><p class="muted">Tax is entered manually. Confirm applicable tax rules before issuing a real quote.</p><button>Save draft estimate</button></form></section><section><h2>Estimates (${db.estimates.length})</h2>${db.estimates.map(e=>`<div class="entry"><b>${esc(e.description)}</b> — ${money(e.total)}<div><small>${esc(e.status)} · ${esc(e.date)} · ${esc(vehicleName(e.vehicleId))}</small></div><button class="no-print" data-approve="${esc(e.id)}" ${e.status==='Approved'?'disabled':''}>Mark approved</button></div>`).join('')||'No estimates yet.'}</section>`}
function vehicleName(vid){let v=db.vehicles.find(v=>v.id===vid);return v?`${v.year} ${v.make} ${v.model}`:'Unknown vehicle'}function invoices(){let approved=db.estimates.filter(e=>e.status==='Approved');return `<section><h2>Invoices</h2><p class="muted">Approved estimates appear here as invoice-ready records. Payment collection and official invoice numbering are not implemented.</p>${approved.map(e=>`<div class="entry"><b>${esc(vehicleName(e.vehicleId))}</b> — ${money(e.total)}<div>${esc(e.description)}</div><small>Parts: ${money(e.parts)} · Labor: ${money(e.labor)} · Fees: ${money(e.fees)} · Tax: ${money(e.tax)}</small></div>`).join('')||'Approve an estimate to see it here.'}<p><button class="no-print" onclick="window.print()">Print this page</button></p></section>`}
function bind(){let f=$('customer');if(f)f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));db.customers.push({id:id(),...d});save();render()};f=$('vehicle');if(f)f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));db.vehicles.push({id:id(),...d});save();render()};f=$('estimate');if(f)f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));let parts=Number(d.partsCost)*(1+Number(d.markup)/100),labor=Number(d.hours)*Number(d.rate),fees=Number(d.fees),tax=Number(d.tax);db.estimates.push({id:id(),date:new Date().toLocaleDateString(),vehicleId:d.vehicleId,description:d.description,parts,labor,fees,tax,total:Math.round((parts+labor+fees+tax)*100)/100,status:'Draft'});save();render()};document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{let e=db.estimates.find(e=>e.id===b.dataset.approve);if(e){e.status='Approved';save();render()}})}render();
</script></body></html>
